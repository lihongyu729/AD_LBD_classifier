# 运行策略：maml | fine_tuning | proto
meta_learning:
  three_loyal_strategies:
    optimizer_strategy:
      name: "anil"
      enable: true
      params:
        inner_lr: 0.01
        inner_steps: 3
        first_order: true
        dropout: 0.06
        label_smoothing: 0.04
        inner_label_smoothing: 0.03
        focal_weight: 0.20
        focal_gamma: 1.0
        use_class_weights: false
        inner_use_class_weights: true
        max_inner_lr: 0.1
        supcon_weight: 0.25 # 对比损失权重
        supcon_temperature: 0.06 # 升级：更尖锐的对比
    
    metric_strategy:
      name: "protonet"
      enable: false
      params:
        metric: "cosine"
        proj_dim: 32
        gamma: 0.1
        temperature: 12.0
        label_smoothing: 0.04
        
    hybrid_strategy:
      name: "hybrid"
      enable: false
      params:
        opt_weight: 0.5
        metric_weight: 0.5
        scheduler: "adaptive" # linear, constant, adaptive

task:
  n_way: 2
  k_shot: 4
  q_query: 4
  train_episodes_override: 0
  min_train_episodes: 40
  max_train_episodes: 96
  max_minority_reuse_per_epoch: 4.2
  min_epoch_coverage_ratio: 0.85
  val_episodes_meta: 140
  allow_unsafe_episode_override: false

ss3m:
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]
  branch_types: ["conv", "mamba"]
  use_checkpoint: true
  # 若 ANIL 梯度为 None，可临时设为 false 以排查是否为 checkpoint + higher 交互问题
  # use_checkpoint: false
  dropout: 0.0
  use_pos_emb: true
  merge_type: softmax

input:
  shape_dhw: [112, 112, 112]

model:
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]

classifier:
  backbone: medmamba_ss3m
  strategy: meta
  use_amp: true
  amp_dtype: bf16
  use_compile: false
  epochs: 160
  batch_size: 4             # ✅ 调整：8→4（显存限制）
  lr: 5.0e-5
  weight_decay: 0.008
  freeze_backbone: false
  warmup_epochs: 12
  lr_scheduler: cosine
  lr_factor: 0.5
  lr_patience: 8
  label_smoothing: 0.05
  ema_decay: 0.99
  max_grad_norm: 0.7
  grad_accum_steps: 1
  pretrained_path: ~/MRI/classifer/out/best_mae_8dir_768dim.pth
  use_class_weights: true
  freeze_bn: false
  backbone_norm: batchnorm
  backbone_norm_groups: 8
  head_type: linear
  head_temperature: 1.0
  head_hidden_dim: 256
  head_dropout: 0.10
  head_activation: silu
  backbone_n_dirs_train: 8
  backbone_use_dual_branch: true
  backbone_lr_ratio: 0.05
  pretrained_failfast_min_ratio: 0.10
  pretrained_warn_ratio: 0.30
  pretrained_auto_scan_siblings: true
  pretrained_auto_scan_max_files: 12
  pretrained_prefer_mae_names: true

metrics:
  - acc
  - auc
  - f1_macro
  - f1_weighted
  - precision_macro
  - recall_macro
  - confusion_matrix

early_stopping:
  patience: 28
  min_delta: 0.0
  monitor: val_raw_auc
  min_epochs: 25
  min_lbd_sens: 0.50
  min_lbd_spec: 0.25
  gate_blocking: false

imbalance:
  # auto | sampler | class_weight | focal | class_weight_focal
  # 对于 2-way episodic meta-learning，单个 episode 已经天然按类均衡。
  # 这里改成 auto，让训练逻辑在“episode 已均衡”时自动关闭过强的 class_weight 叠加。
  mode: auto
  class_weight_mode: effective_num
  class_weight_beta: 0.995
  respect_episode_balance: true
  balanced_episode_focal_weight: 0.10

thresholding:
  # Prevent threshold leakage in early stopping by default.
  allow_tuned_early_stop: false
  # Calibrate threshold on a calibration split and evaluate on a disjoint split.
  calib_fraction: 0.4
  split_seed: 42

logging:
  tensorboard: false

debug:
  enabled: false
  epochs: 1
  folds: 1

stability:
  safe_mode: false
  cudnn_benchmark: true
  cudnn_deterministic: false

dataset:
  # 文件夹标签模式：仅采样 AD/LBD 二类（建议与 folder_label_map 类名一致）
  folder_label_map:
    AD: 0
    LBD: 1
  allowed_labels: ['AD', 'LBD']
  num_workers: 12
  prefetch_factor: 4
  use_weighted_sampler: false
  # CSV 标签模式（如使用清单）
  label_map:
    AD: 0
    LBD: 1
  label_column_path: path
  label_column_class: label
  folder_file_exts: [".nii", ".nii.gz"]
  folder_require_substring: null

preprocess_cache:
  enabled: true
  cache_dir: ~/MRI/pretrain/code/meta/cache

augment:
  enable: true
  flip_p: 0.3               # ✅ 调整：0.5→0.3（保守增强）
  noise_std: 0.02
  gamma_jitter: 0.08
  cutout_p: 0.08
  cutout_frac: 0.08


paths:
  out_dir: ~/MRI/pretrain/code/meta/out
  
  # 全量数据（train/val/test 合并为同一数据池）
  label_roots:
    AD: ~/split_1mm_112/AD
    LBD: ~/split_1mm_112/LBD
    MCI: ~/split_1mm_112/MCI
      
cv:
  split_mode: holdout
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  cv_n_splits: 1
  run_folds: 1
  cv_shuffle: true
  cv_random_state: 42
  stratified: true
  sample_fraction: 1.0
  quick_folds: 2
  nested_cv:
    outer_folds: 5
    locked_test_ratio: 0.2
    patient_id_mode: parent_dir
    patient_id_regex: null

device:
  force: "cuda" # 强制使用 cuda，如果不可用会报错
  cuda_device: 0
