# 微调配置示例：请根据仓库内现有配置的键名进行对齐和扩展
# 关键原因：
# - dataset_path：训练管线从此 JSON 读取分类数据（image+label）；与官方格式兼容
# - num_classes：分类头输出维度，确保与任务一致
# - full_pretrained_weights / pretrained：加载预训练模型，提高收敛与性能
# - output_dir：保存日志与权重，用于论文对比和复现
# - cache-dir（在启动命令里传参）：启用 MONAI 缓存以加速数据加载

DATASET:
  dataset_path: "~/MRI/code/split_1mm_112.json"  # 您的分类JSON
  num_classes: 3

MODEL:
  # 根据仓库约定的键名选择：有的配置使用 'full_pretrained_weights'，有的使用 'pretrained'
  full_pretrained_weights: "~/MRI/code/dinov2/models/3dino_vit_weights.pth"  # 预训练权重

OUTPUT:
  output_dir: "/root/ino/code/out/3dino_finetune_cls"  # 训练输出目录

TRAIN:
  # 将原本指向不存在文件的路径，改为你实际存在的分类 JSON
  # 原因：日志显示代码在读取 train.dataset_path 时访问了 /home/txu/.../dinov2_subset_datalist.json 导致 FileNotFoundError
  dataset_path: ~/MRI/code/split_1mm_112.json
  # 其余参数保持不变
  batch_size_per_gpu: 128
  num_workers: 32
  cache_dir: ~/MRI/cache
  epochs: 100
  batch_size: 2
  lr: 1e-4
