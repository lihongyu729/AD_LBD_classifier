# ============================================================================
# ANIL Mamba-only 消融实验
# 配置来源: meta/config_ablation_mamba_v5.yaml (v5)
# 同时需要 code 层面 traing 文件夹里面有 ~/MRI/pretrain/code/metamamba_ss3m.py (v5 修复版)
# 代码修复:
#   - 服务器 ~/MRI/pretrain/code/meta/strategies/anil.py (inner_weight_decay 支持)
#   - 服务器 ~/MRI/pretrain/code/benchmark/core/base_method.py (ssm_b→ssm_a remap)
#   - benchmark/core/trainer.py (inner_weight_decay + AMP compat)
# ============================================================================

experiment:
  method: "anil"

model:
  backbone: "medmamba_ss3m"
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]

ss3m:
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]
  branch_types: ["mamba", "mamba"]       # 单分支 mamba
  use_checkpoint: true
  dropout: 0.0                            # 不额外 dropout
  use_pos_emb: true
  merge_type: softmax
  n_dirs_train: 8
  use_dual_branch: false                  # ★ 单分支

training:
  lr: 5.0e-5
  backbone_lr_ratio: 0.25                 # 代码修复后 ~92% 预训练，温和微调
  epochs: 200
  weight_decay: 0.05
  warmup_epochs: 10
  lr_scheduler: "cosine"
  label_smoothing: 0.05
  ema_decay: 0.997
  max_grad_norm: 0.5

meta:
  strategy:
    name: "anil"
    inner_lr: 0.005
    inner_steps: 1
    first_order: true
    dropout: 0.10
    label_smoothing: 0.05
    inner_label_smoothing: 0.0           # ★ 关闭内层平滑
    focal_weight: 0.0                    # ★ 关闭 ANIL 内 focal
    focal_gamma: 1.0
    use_class_weights: false             # ★ 关闭显式类别权重
    inner_use_class_weights: false
    max_inner_lr: 0.03
    supcon_weight: 0.0                   # ★ 关闭 SupCon
    supcon_temperature: 0.06
    inner_weight_decay: 0.0003           # ★ 内层 SGD 正则化

early_stopping:
  patience: 50
  min_delta: 0.0
  monitor: "val_auc"
  min_epochs: 30
  min_lbd_sens: 0.35
  min_lbd_spec: 0.35
  gate_blocking: false
