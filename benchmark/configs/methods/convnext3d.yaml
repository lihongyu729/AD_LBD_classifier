# ConvNeXt 3D — Modern CNN with Transformer design elements
experiment:
  method: "convnext3d"

model:
  backbone: "convnext3d"
  variant: "Tiny"              # Tiny|Small|Base
  in_channels: 1
  num_classes: 2
  depths: [3, 3, 9, 3]        # Tiny: [3,3,9,3], Small/Base: [3,3,27,3]
  dims: [96, 192, 384, 768]   # Tiny/Small: [96,192,384,768], Base: [128,256,512,1024]
  drop_path_rate: 0.1
  pretrained_path: ""

training:
  lr: 1.0e-4
  backbone_lr_ratio: 0.1
  epochs: 150
  batch_size: 4
