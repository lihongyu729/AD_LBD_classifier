# ============================================================================
# ANIL Conv-only 消融实验 (v5)
# 来源: meta/config_ablation_conv_v5.yaml
# 预训练匹配 ~95%，仅需 config 层面修复（关闭叠加损失 + 内层正则）
# ============================================================================

experiment:
  method: "anil"

model:
  backbone: "medmamba_ss3m"
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]

ss3m:
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]
  branch_types: ["conv", "conv"]          # 单分支 conv
  use_checkpoint: true
  dropout: 0.0
  use_pos_emb: true
  merge_type: softmax
  n_dirs_train: 8
  use_dual_branch: false

training:
  lr: 5.0e-5
  backbone_lr_ratio: 0.15                 # 95% 预训练，温和微调
  epochs: 200
  weight_decay: 0.05
  warmup_epochs: 10
  lr_scheduler: "cosine"
  label_smoothing: 0.05
  ema_decay: 0.997
  max_grad_norm: 0.5

meta:
  strategy:
    name: "anil"
    inner_lr: 0.002
    inner_steps: 1
    first_order: true
    dropout: 0.15
    label_smoothing: 0.05
    inner_label_smoothing: 0.0
    focal_weight: 0.0
    focal_gamma: 1.0
    use_class_weights: false
    inner_use_class_weights: false
    max_inner_lr: 0.02
    supcon_weight: 0.0
    supcon_temperature: 0.06
    inner_weight_decay: 0.0003

early_stopping:
  patience: 50
  min_delta: 0.0
  monitor: "val_auc"
  min_epochs: 30
  min_lbd_sens: 0.35
  min_lbd_spec: 0.35
  gate_blocking: false
