# ===========================================================================
# ANIL v2 Balanced — 目标: val AUC≥0.9, BAC≥0.9
# 核心改动: 类别加权 + focal增强 + episode平衡
# ===========================================================================
experiment:
  name: "AD_vs_LBD_benchmark"
  method: "anil"
  seed: 42
  note: "v2_balanced"

data:
  label_roots:
    AD: "/root/lhy/data/AD"
    LBD: "/root/lhy/data/LBD"
  target_shape: [112, 112, 112]
  folder_file_exts: [".nii", ".nii.gz"]

cv:
  n_splits: 5
  run_folds: 5
  shuffle: true
  stratified: true
  sample_fraction: 1.0

training:
  epochs: 200
  batch_size: 4
  lr: 3.0e-5
  weight_decay: 0.05
  backbone_lr_ratio: 0.05
  warmup_epochs: 15
  lr_scheduler: "cosine"
  label_smoothing: 0.03
  ema_decay: 0.99
  max_grad_norm: 1.0
  grad_accum_steps: 1
  use_amp: true
  amp_dtype: "bf16"

early_stopping:
  patience: 35
  min_delta: 0.001
  monitor: "val_auc"
  min_epochs: 40
  min_lbd_sens: 0.5
  min_lbd_spec: 0.25
  gate_blocking: false

thresholding:
  calib_fraction: 0.4
  split_seed: 42

model:
  in_channels: 1
  num_classes: 2
  pretrained_path: "/root/lhy/code/weights/best_mae_8dir_768dim.pth"
  backbone: "medmamba_ss3m"
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]

ss3m:
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]
  branch_types: ["conv", "mamba"]
  use_checkpoint: true
  dropout: 0.1
  use_pos_emb: true
  merge_type: "softmax"
  n_dirs_train: 8
  use_dual_branch: true

meta:
  n_way: 2
  k_shot: 6
  q_query: 4
  train_episodes: 40
  val_episodes: 80

  strategy:
    name: "anil"
    inner_lr: 0.015
    inner_steps: 5
    first_order: true
    dropout: 0.1
    label_smoothing: 0.02
    inner_label_smoothing: 0.02
    focal_weight: 0.5
    focal_gamma: 2.5
    use_class_weights: true
    inner_use_class_weights: true
    max_inner_lr: 0.1
    class_weights: [1.0, 8.0]
    supcon_weight: 0.15
    supcon_temperature: 0.07

output:
  root_dir: "./results"

device:
  force: "cuda"
  cuda_device: 0
