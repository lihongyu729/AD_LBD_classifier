# ProtoNet: Prototypical Networks with MedMambaSS3M
experiment:
  method: "protonet"

model:
  backbone: "medmamba_ss3m"
  embed_dim: 768
  depth: 6
  patch_size: [16, 16, 16]

training:
  lr: 5.0e-5
  backbone_lr_ratio: 0.05
  epochs: 160

meta:
  strategy:
    name: "protonet"
    metric: "cosine"
    proj_dim: 32
    gamma: 0.1
    temperature: 12.0
    label_smoothing: 0.04
